<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
    section{
        background-color: antiquewhite;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1,p{
    	text-align: center;
        color: antiquewhite;
    }
    body{
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; background-color: darkred;
    }
    #submit{
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    #movie{
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; background-color: white;
    }
    input[type="text"], select, textarea, input[type="submit"]     {
        width: 94%;
    	padding: 15px;
    	border: 1px solid #ccc;
    	border-radius: 5px;
    	text-align: center;
    }
    #review{
        text-align: center; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; background-color: white;
    }
    input[type="submit"]{
        cursor: pointer; 
        width: 100%;
        color: antiquewhite;
        background-color: darkred;
    }
    </style>
</head>
<body>
   <header>
        <h1>GIVE A RATING</h1>
        <p>Have any thoughts on a movie you recently watched? Feel free to share some!</p>
    </header>
    <br>
    <section>
    <form>
        <img style="display: block; height: 175px; width: 200px; margin: 0 auto; background: transparent;" src="https://png.pngtree.com/png-vector/20250506/ourmid/pngtree-popcorn-and-3d-glasses-for-cinema-essentials-indicating-a-soothing-movie-png-image_16172008.png" alt="logo">
        <br>
        <label for="movie">Movie Title</label>
        <br>
        <input type="text" id="movie" name="movie" placeholder="Type here...">
        <br>
        <br>
        <label for="genre">Genres </label> 
        <br>
        <input type="checkbox" id="genre1" name="genre">
            <label for="genre">Romance</label>
        <input type="checkbox" id="genre2" name="genre">
            <label for="genre">Fantasy</label>
        <input type="checkbox" id="genre3" name="genre">
            <label for="genre">Action</label>
        <input type="checkbox" id="genre4" name="genre">
            <label for="genre">Sci-Fi</label>
        <input type="checkbox" id="genre5" name="genre">
            <label for="genre">Thriller</label>
        <input type="checkbox" id="genre6" name="genre">
            <label for="genre">Horror</label>
        <input type="checkbox" id="genre7" name="genre">
            <label for="genre">Drama</label>
        <br>
        <br>
        <label for="rate">Rating</label>
        <br>
        <input type="radio" id="rate1" name="rate">
            <label for="rate">⭐️</label>
        <input type="radio" id="rate2" name="rate">
            <label for="rate">⭐️⭐️</label>
        <input type="radio" id="rate3" name="rate">
            <label for="rate">⭐️⭐️⭐️</label>
        <input type="radio" id="rate4" name="rate">
            <label for="rate">⭐️⭐️⭐️⭐️</label>
        <input type="radio" id="rate5" name="rate">
            <label for="rate">⭐️⭐️⭐️⭐️⭐️</label>
        <br>
        <textarea id="review" placeholder="Write a review..." rows="5" cols="50"></textarea>
        <br>
        <input type="submit" id="submit" value="Submit Review">
        <br>
        <br>
        In order to view more movie details, click <a href="link here" target="_blank">here</a>.
    </form>
    </section>
</body>
</html>
